# Stack Portainer (Stacks > Add stack > Repository, chemin : portainer-stack.yml).
# Les variables saisies dans Portainer (onglet Environment variables) sont écrites
# par Portainer dans stack.env, lu ci-dessous. Guide : docs/PORTAINER.md
services:
  wikimastered:
    build: .
    image: wikimastered:latest
    # Reconstruit l'image à chaque déploiement : sinon Portainer réutilise l'ancienne image
    # et l'ancien code continue de tourner après une mise à jour du dépôt.
    pull_policy: build
    container_name: wikimastered
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      TZ: Europe/Paris
    volumes:
      # Volume nommé : survit aux redéploiements et hérite des droits de l'image (UID 1000).
      - wikimastered_data:/app/data
      # Sauvegardes de la base : un volume à part, pour qu'elles survivent à la perte du volume des données.
      - wikimastered_backups:/app/backups
    stop_grace_period: 20s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wikimastered_data:
  wikimastered_backups:
