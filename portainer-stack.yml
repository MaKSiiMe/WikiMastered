# Stack Portainer (Stacks > Add stack > Repository, chemin : portainer-stack.yml).
# Les variables saisies dans Portainer (onglet Environment variables) sont écrites
# par Portainer dans stack.env, lu ci-dessous. Guide : docs/INSTALLATION.md
services:
  wikimastered:
    image: wikimastered:latest
    # construction: début
    # Image construite sur le serveur, reconstruite à chaque déploiement (sinon l'ancien code continue de
    # tourner). La CI publie sur la branche `deploy` cette même pile sans ce bloc, avec l'image construite par
    # GitHub (ghcr.io/…/wikimastered:sha-<commit>) : voir docs/INSTALLATION.md.
    build: .
    pull_policy: build
    # construction: fin
    container_name: wikimastered
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      TZ: Europe/Paris
    volumes:
      # Volume nommé : survit aux redéploiements et hérite des droits de l'image (UID 1000).
      - wikimastered_data:/app/data
      # Sauvegardes de la base : un volume à part, pour qu'elles survivent à la perte du volume des données.
      - wikimastered_backups:/app/backups
    stop_grace_period: 20s
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wikimastered_data:
  wikimastered_backups:
