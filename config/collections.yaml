# Collections à compléter (worker Collection). COLLECTION_SETS choisit celles qui sont actives,
# par leur clé : COLLECTION_SETS=days,elements (les noms français jours, pays restent acceptés).
#
# « days » (les 366 jours de l'année, étiquette TAG_DAYS) est intégrée au code.
# Une autre collection se décrit ici :
#   name       affiché dans le récap, le bilan et `python -m src.main collection`
#   tag        posée sur un exemplaire de chaque carte possédée (à créer une fois sur le site ;
#              l'ajouter à TAG_PROTECTED pour qu'il ne soit jamais vendu). Sans tag : aucune.
#   titles     titres exacts des articles Wikipédia, comme sur les cartes du site
#              (« Mercure (chimie) », pas « Mercure »).
#   file       pour une longue liste : fichier à côté de celui-ci, un titre par ligne.
# Les anciennes clés françaises (nom, etiquette, titres, fichier) restent lues.
#
# Plafond propre à une collection (COLLECTION_SET_MAX_PRICE=elements=100), ou mise jusqu'à sa cote × un ratio comme
# une revente (COLLECTION_SET_QUOTE_RATIO=countries=0.8) : voir docs/REGLAGES.md.

# Les 118 éléments du tableau périodique, par numéro atomique (titres des articles liés sur Wikidata).
elements:
  name: Éléments chimiques
  tag: Élément
  file: elements.txt

# Les 193 États membres de l'ONU, plus le Vatican, la Palestine, le Kosovo et Taïwan (titres liés sur Wikidata).
# Pas de tag : « Pays » est posée par le worker themes (config/themes.yaml) sur l'exemplaire gardé.
countries:
  name: Pays
  file: countries.txt

# Articles dont l'image principale est un GIF animé (liste régénérée par `python -m src.tools.gif_list`).
# Pas de tag ici : « GIF » (TAG_GIF) est posée par le worker themes, d'après l'image de chaque carte.
gifs:
  name: GIF animés
  # Cartes animées absentes du fichier, vues chez un autre joueur le 02/11 : image ou titre différents de Wikipédia (apostrophe
  # courbe, article renommé en « Shitpost »). Ici, elles restent quand le fichier est régénéré.
  titles:
    - Cuisine du Yémen
    - Déclin de l’Empire byzantin
    - Shitposting
  file: animated_gifs.txt
