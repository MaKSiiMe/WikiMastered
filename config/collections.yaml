# Collections à compléter (worker Collection). COLLECTION_SETS choisit celles qui sont actives,
# par leur clé : COLLECTION_SETS=jours,elements.
#
# « jours » (les 366 jours de l'année, étiquette COLLECTION_TAG) est intégrée au code.
# Une autre collection se décrit ici :
#   nom        affiché dans le récap, le bilan et `python -m src.main collection`
#   etiquette  posée sur un exemplaire de chaque carte possédée (à créer une fois sur le site ;
#              l'ajouter à PROTECTED_TAGS pour qu'il ne soit jamais vendu). Sans etiquette : aucune.
#   titres     titres exacts des articles Wikipédia, comme sur les cartes du site
#              (« Mercure (chimie) », pas « Mercure »).
#   fichier    pour une longue liste : fichier à côté de celui-ci, un titre par ligne.
#
# Exemple :
# elements:
#   nom: Éléments chimiques
#   etiquette: élément
#   titres:
#     - Hydrogène
#     - Hélium
#     - Lithium

# Articles dont l'image principale est un GIF animé (liste régénérée par `python -m src.tools.gif_list`).
# Pas d'etiquette ici : « GIF » (THEME_GIF_TAG) est posée par le worker etiquettes, d'après l'image de chaque carte.
gifs:
  nom: GIF animés
  # Cartes animées absentes du fichier, vues chez un autre joueur le 02/11 : image ou titre différents de Wikipédia (apostrophe
  # courbe, article renommé en « Shitpost »). Ici, elles restent quand le fichier est régénéré.
  titres:
    - Cuisine du Yémen
    - Déclin de l’Empire byzantin
    - Shitposting
  fichier: gifs_animes.txt
