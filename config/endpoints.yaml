# Registre des routes WikiMasters utilisées par le bot.
#
# Rien ici n'est inventé : chaque route provient du code des extensions communautaires
# (relevé du 14/10/2026) :
#   [KZ] qkerman/WikiMastersTools-kzfamily   (bridge/*.js, features/*.js)
#   [WR] Lypningeuh/WikiRemastered            (extension/api.js, market-api.js, network.js,
#                                              pack-cards.js, docs/TECHNIQUE.md)
#   [WP] ThePommespanzer/wikimasters-plus     (extension/content.js, inject.js)
#
# Si le site change, corrige ici (ou importe une requête avec
#   python -m src.tools.parse_curl --name <clé> --write  <  ma_requete.curl
# ) puis vérifie les réponses avec : python -m src.main inspect
#
# Format :
#   method   GET | POST
#   path     chemin, avec {placeholders} (encodés URL)
#   params   query string ; un paramètre rendu vide est omis
#   json     corps JSON ; une valeur "{x}" seule garde le type Python de x
#   defaults valeurs par défaut des placeholders

base_url: https://www.wiki-masters.com

endpoints:
  # --- Lecture -----------------------------------------------------------------
  balance:                      # [WR market-api.js] -> { balance: int }
    method: GET
    path: /api/wikibidous

  collection_page:              # [WR api.js, KZ bridge/collection.js] page de 50 exemplaires, page>=0
    method: GET                 # -> { collection: [ { id, card_id, card{...}, is_shiny, starred,
    path: /api/my-collection    #       snapshot_rarity, user_id, tags } ], total? }
    params: {sort: "{sort}", page: "{page}", stats: "0", q: "{q}", rarity: "{rarity}"}
    defaults: {sort: added, q: "", rarity: ""}  # rarity : une rareté ou une liste (paramètre répété, relevé du 21/11)

  collection_tagged:            # mes exemplaires qui portent une étiquette (URL relevée le 21/11 sur le site), page>=0
    method: GET
    path: /api/my-collection
    params: {sort: rarity, tag_id: "{tag_id}", page: "{page}", stats: "0"}

  player_collection:            # collection publique d'un joueur (profil d'un joueur, relevé du 02/11), page>=0, page de 50
    method: GET
    path: /api/profile/{username}/collection
    params: {page: "{page}", sort: rarity, stats: "1", tag_id: "{tag_id}", pending: "1"}
    defaults: {tag_id: ""}

  friend_wishlisted:            # ses cartes qui sont dans ma liste de souhaits, page>=0 [wikimasters-cli]
    method: GET
    path: /api/profile/{username}/collection
    params: {page: "{page}", sort: rarity, stats: "0", pending: "1", wishlisted_by_me: "1"}

  wishlist_catalog:             # ma liste de souhaits et les amis qui possèdent chaque carte, page>=0, page de 50
    method: GET                 #   [wikimasters-cli] -> { cards: [...], friendOwners: {card_id: [{username, rarities}]} }
    path: /api/cards
    params: {page: "{page}", sort: rarity, wishlist: "1"}

  collection_stats:             # [WR api.js, KZ] -> { total: int, rarities: [ {rarity, count} ] }
    method: GET
    path: /api/my-collection/stats
    params: {sort: "{sort}"}
    defaults: {sort: added}

  market_page:                  # [WR market-api.js] page>=1, sort: ending_soon | recent | price_asc | price_desc ;
                                #   rarity=UR, ou une liste (paramètre répété : rarity=L&rarity=UR, relevé du 21/11) (relevé
    method: GET                 #   du 15/10/2026, limit 50 max) -> { auctions: [ {id, card{...}, seller_id,
    path: /api/marketplace      #   status, end_at, base_amount, current_bid, current_bidder_id} ], hasMore }
    params: {page: "{page}", limit: "{limit}", sort: "{sort}", q: "{q}", rarity: "{rarity}"}
    defaults: {page: 1, limit: 50, sort: ending_soon, q: "", rarity: ""}

  auction_detail:               # [WR market-api.js, KZ bridge/marketplace.js] -> { auction: {...} }
    method: GET
    path: /api/marketplace/{auction_id}

  sales_summary:                # [KZ bridge/prices.js, WR api.js] limitée par le site (403 + Retry-After)
    method: GET                 # -> { summary: { "<rareté>": {average, count?} }, isPro } (count absent hors PRO)
    path: /api/marketplace/cards/{card_id}/sales
    params: {scope: summary}

  sales_history:                # [WP market.js] historique public des ventes d'une carte
    method: GET                 # -> { recent: [ {final_price, ...} ], sales: [ ... ] }
    path: /api/marketplace/cards/{card_id}/sales

  price_history:                # historique des prix d'une carte (fiche de la carte, relevé du 21/11)
    method: GET                 # -> { computed_at, by_rarity: { "<rareté>": { weekly: [ {start, avg, min, max,
    path: /api/marketplace/cards/{card_id}/price-history   # count} ] } } }

  reprice_listing:              # baisse la mise de départ d'une de mes ventes (relevé du 21/11) : une seule fois, sans
    method: POST                #   mise, après la moitié de la durée, montant < départ -> 200 ou { error }
    path: /api/marketplace/{auction_id}/reprice
    json: {new_base_amount: "{amount}"}

  settle_auction:               # finalise une enchère finie mais pas encore réglée (« Finalisation… » sur la fiche,
    method: POST                #   relevé du 21/11)
    path: /api/marketplace/{auction_id}/settle

  showcase:                     # mes vitrines (relevé du 21/11) -> { galleries: [ {gallery_index, name, layout} ],
    method: GET                 #   showcase: [ {position, gallery_index, caption, user_card: {id, card{...}, ...}} ] }
    path: /api/showcase

  showcase_gallery:             # enregistre une vitrine (relevé du 21/11)
    method: PUT
    path: /api/showcase/gallery
    json: {gallery_index: "{gallery_index}", layout: "{layout}", name: "{name}", user_card_ids: "{user_card_ids}",
           captions: "{captions}"}

  my_listings:                  # [KZ bridge/marketplace.js] -> { sellingCount, maxConcurrentAuctions }
    method: GET                 #   (relevé réel du 14/10/2026 : 5 ventes simultanées max)
    path: /api/marketplace/mine

  my_bids:                      # [KZ features/my-bids.js] -> { bidding: [mes enchères], selling: [mes ventes],
                                #   auctions: [marché général, à ignorer], hasMore }
    method: GET
    path: /api/marketplace
    params: {page: "1", limit: "{limit}", mine: "1"}
    defaults: {limit: 50}

  active_trades:                # [WR api.js] -> { trades: [ {status, items: [ {card_id,
    method: GET                 #   user_card_id, offered_by} ] } ] }
    path: /api/trades
    params: {active: "1"}

  trades:                       # tous tes échanges, terminés compris (supposé : la même route sans `active`) ;
    method: GET                 #   lue une fois par échange terminé, pour relever son statut final
    path: /api/trades

  # --- Écriture (bloquées tant que DRY_RUN=true, jamais rejouées) -------------------
  place_bid:                    # [WR market-api.js] -> { current_bid, bidder_balance }
    method: POST                #   erreur possible : { error, min }
    path: /api/marketplace/{auction_id}/bid
    json: {amount: "{amount}"}

  create_listing:               # [KZ bridge/marketplace.js] card_id = id de l'EXEMPLAIRE possédé
                                # réponse réelle (14/10/2026) : HTTP 201 { auction_id }
    method: POST
    path: /api/marketplace
    json: {card_id: "{owned_card_id}", base_amount: "{base_amount}", duration_minutes: "{duration_minutes}"}

  # Succès [FW 3d3n-pyc/wikimasters-farm client.py, LB LockBlock-dev/wikimasters-bot types.ts],
  # pas encore vérifiés sur le site : les premières réponses sont gardées dans data/inspect/writes/.
  achievements_check:           # recalcule les succès débloqués (le site le fait à l'ouverture de la page)
    method: POST
    path: /api/achievements/check
    json: {event: achievements_sync}

  claim_achievement:            # -> { claimed_at, already_claimed, amount }
    method: POST
    path: /api/achievements/claim
    json: {achievement_id: "{achievement_id}"}

  mark_notifications_read:      # route de la cloche du site, relevée par wikimasters-cli
    method: PATCH
    path: /api/notifications
    json: {ids: "{ids}"}

  bulk_discard:                 # [WR api.js, discard.js] 50 exemplaires max par lot
    method: POST                # -> { discarded_count, failed: [] }
    path: /api/user-cards/bulk-discard
    json: {card_ids: "{owned_card_ids}"}
