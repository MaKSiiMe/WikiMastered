name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances (sans Playwright, inutile aux tests)
        run: pip install -r requirements.txt pytest==8.4.2 pytest-asyncio==1.2.0
      - name: Tests
        run: python -m pytest -q
      - name: Script d'installation
        run: shellcheck installer.sh

  image:
    name: image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image (sans publication)
        run: docker build -t wikimastered:ci .
