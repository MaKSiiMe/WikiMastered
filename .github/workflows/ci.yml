name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances (sans Playwright, inutile aux tests)
        run: pip install -r requirements.txt pytest==8.4.2 pytest-asyncio==1.2.0
      - name: Tests
        run: python -m pytest -q
      - name: Script d'installation
        run: shellcheck installer.sh

  image:
    name: image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construction de l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Fusion sur main : l'image est publiée sur ghcr (sha-<commit> et latest), puis la pile qui la fixe est écrite sur
  # la branche `deploy`, que Portainer surveille. Revenir en arrière : remettre l'ancien tag dans portainer-stack.yml
  # de la branche `deploy`. « [skip deploy] » dans le message du commit laisse le serveur tel quel.
  release:
    name: publication
    needs: [tests, image]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom et tag de l'image
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pile fixée sur cette image, sur la branche deploy
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          stack="$RUNNER_TEMP/portainer-stack.yml"
          sed -e '/# construction: début/,/# construction: fin/d' \
              -e "s|image: wikimastered:latest|image: $IMAGE|" portainer-stack.yml > "$stack"
          grep -q "image: $IMAGE$" "$stack"
          ! grep -qE '^\s*(build|pull_policy):' "$stack"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin deploy; then
            git checkout -B deploy FETCH_HEAD
          else
            git checkout --orphan deploy
            git rm -rfq .
          fi
          cp "$stack" portainer-stack.yml
          git add portainer-stack.yml
          if git diff --cached --quiet; then exit 0; fi   # même commit relancé
          git commit -m "deploy ${GITHUB_SHA::7} : ${{ github.event.head_commit.url }}"
          git push origin deploy
